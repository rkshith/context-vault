services:
  # Local postgres/qdrant removed: production data lives in Supabase + Qdrant Cloud.
  # Volumes below are kept so local data is still available as rollback.
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # hot-reload source in dev
      - ./backend/app:/app/app
      # uploaded files live outside the image
      - filedata:/app/storage
      # fastembed model cache
      - modelcache:/app/models
    depends_on: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
  qdrantdata:
  filedata:
  modelcache:
